[project]
name = "llmbench"
version = "0.1.0"
description = "Reproducible LLM inference benchmark: latency, throughput, memory, quantization, KV cache, speculative decoding."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "psutil>=5.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# llama.cpp backend (GGUF): steps 1 and 2, fast on CPU.
llamacpp = ["llama-cpp-python>=0.3", "huggingface_hub>=0.24"]
# Hugging Face backend: steps 3 (KV cache) and 4 (speculative decoding).
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.34", "optimum-quanto>=0.2"]
# pyarrow: only to read the parquet sources in scripts/prepare_eval_data.py.
dev = ["pytest>=8", "ruff>=0.6", "pyarrow>=15"]

# Without this, uv would install torch with CUDA (~2.5 GB wasted: no NVIDIA GPU here).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
